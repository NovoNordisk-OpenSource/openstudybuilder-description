# Style Sheet
extra_css:
  - stylesheets/general.css

# Extra configuration
extra:
  generator: false

# Repository
repo_name: OpenStudyBuilder
repo_url: https://github.com/NovoNordisk-OpenSource/openstudybuilder-description

# Configuration
theme:
  name: material

  features:
    - navigation.tabs
    - navigation.indexes
  favicon: favicon.ico
  logo: logoMini.svg
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: mkdocs_custom/

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.snippets:
      base_path: .
  - attr_list  
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg